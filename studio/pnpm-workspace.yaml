# studioを「独立したワークスペースルート」として宣言するためのファイル。
# これが無いと、pnpmは親ディレクトリの pnpm-workspace.yaml まで遡ってそちらを
# ワークスペースルートと見なし、studioはそのメンバーではないため
# 「インストールするものが無い」と判断して依存を一切入れない（＝ビルドが壊れる）。
# このファイルを置くことでpnpmの探索がここで止まり、studio単体で解決・ロックされる。
packages: []

# ルート側と同じく、esbuildのインストールスクリプト実行を明示的に許可する
# （未指定だとpnpmが確認待ちでビルドを止める）。
allowBuilds:
  esbuild: true
