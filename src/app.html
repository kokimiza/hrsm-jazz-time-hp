<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />

		<!-- ライト/ダークのテーマをCSS読み込み・描画より前に確定させる（フラッシュ防止）。
		     未選択時のデフォルトはダーク（システム設定は見ない）。 -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('jazztime-theme');
					var resolved = stored === 'light' ? 'light' : 'dark';
					if (resolved === 'dark') document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400&family=Zen+Old+Mincho:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap"
		/>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
